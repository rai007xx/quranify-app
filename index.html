<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}

        // Suppress extension runtime crashes from interfering with the app
        window.addEventListener('error', function(e) {
          if (
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e.message && e.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (
            e.reason &&
            (
              (typeof e.reason === 'string' && e.reason.indexOf('Cannot set property fetch') !== -1) ||
              (e.reason.message && e.reason.message.indexOf('Cannot set property fetch') !== -1) ||
              (e.reason.stack && e.reason.stack.indexOf('chrome-extension://') !== -1)
            )
          ) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
    <title>Al-Quran Audio - Free Quran Recitation Streaming</title>
    <meta name="description" content="100% free modern dark-themed Quran audio streaming mobile app with seamless playback, famous reciters, and full Flutter source architecture." />

    <meta property="og:description" content="100% free modern dark-themed Quran audio streaming mobile app with seamless playback, famous reciters, and full Flutter source architecture." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
